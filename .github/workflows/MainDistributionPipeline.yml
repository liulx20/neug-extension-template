#
# Main distribution pipeline for NeuG extensions built from this template.
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      neug_repository:
        description: NeuG source repository (owner/name)
        required: false
        default: liulx20/neug
      neug_ref:
        description: NeuG git ref (branch, tag, or SHA)
        required: false
        default: feat/out-of-tree-extension-cmake

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

env:
  NEUG_REPOSITORY: ${{ github.event.inputs.neug_repository || 'liulx20/neug' }}
  NEUG_REF: ${{ github.event.inputs.neug_ref || 'feat/out-of-tree-extension-cmake' }}

jobs:
  linux-build:
    name: Build extension (linux_x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout NeuG
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NEUG_REPOSITORY }}
          ref: ${{ env.NEUG_REF }}
          path: neug

      - name: Install dependencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build libssl-dev

      - name: Build extension
        run: make

      - name: Test extension
        run: make test

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiggle-linux_x86_64
          path: build/release/extension/wiggle/libwiggle.neug_extension
